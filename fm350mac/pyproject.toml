[project]
name = "fm350mac"
version = "0.1.0"
description = "User-space macOS data path for a Fibocom FM350-GL 5G modem (USB RNDIS -> utun)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/sebastianspicker/fm350-usb"
Documentation = "https://github.com/sebastianspicker/fm350-usb/tree/main/fm350mac#readme"
Issues = "https://github.com/sebastianspicker/fm350-usb/issues"

[project.scripts]
fm350mac = "fm350mac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fm350mac"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pin the rule set: recent ruff releases enable far more rules when unconfigured.
select = ["E4", "E7", "E9", "F", "I"]
