name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fm350mac:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    name: fm350mac (macos-latest)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fm350mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: ruff
        run: uvx ruff@0.16.10 check . ../tools

      - name: helper compiles under system /usr/bin/python3
        run: /usr/bin/python3 -I -S -c 'import sys; compile(open(sys.argv[1]).read(), sys.argv[1], "exec")' src/fm350mac/helper/fm350mac_helper.py

  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    name: build and install the wheel (macos-latest)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fm350mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Build wheel and sdist
        run: uv build -o dist

      - name: Check the wheel and sdist contents
        run: |
          unzip -l dist/*.whl
          unzip -l dist/*.whl | grep -q 'fm350mac/helper/fm350mac_helper.py'
          unzip -l dist/*.whl | grep -q 'dist-info/licenses/LICENSE'
          tar tzf dist/*.tar.gz | grep -q 'fm350mac/helper/fm350mac_helper.py'
          tar tzf dist/*.tar.gz | grep -q 'LICENSE$'

      - name: Install the wheel into a fresh venv and run it
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/fm350mac" --version
          "$RUNNER_TEMP/wheel-venv/bin/fm350mac" --help
          "$RUNNER_TEMP/wheel-venv/bin/fm350mac" helper install --dry-run --allowed-uid 501

  shellcheck:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    name: shellcheck (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          shellcheck openwrt/*.sh openwrt/files/etc/hotplug.d/usb/50-fm350_driver openwrt/files/usr/sbin/fm350-watchdog openwrt/files/etc/init.d/fm350-watchdog tools/bench-throughput.sh
