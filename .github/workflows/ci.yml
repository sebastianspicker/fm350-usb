name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fm350mac:
    name: fm350mac (macos-latest)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fm350mac
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Python syntax
        run: python3 -m compileall -q src ../tools/fm350_at.py ../tools/fm350_diag.py

      - name: ruff
        run: uvx ruff check src ../tools/fm350_at.py ../tools/fm350_diag.py

  shellcheck:
    name: shellcheck (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck openwrt/*.sh openwrt/files/etc/hotplug.d/usb/50-fm350_driver openwrt/files/usr/sbin/fm350-watchdog openwrt/files/etc/init.d/fm350-watchdog
