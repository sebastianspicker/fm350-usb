name: Release

# Releases are manually dispatched from the default branch for an existing tag.
# Build is read-only; publishing only downloads the verified artifact.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0a1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      commit: ${{ steps.release-ref.outputs.commit }}
    name: build the wheel and sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fm350mac
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the existing tag and select its source
        id: release-ref
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([ab][0-9]+|rc[0-9]+)?$ ]] || { echo "invalid version tag" >&2; exit 1; }
          git show-ref --verify --quiet "refs/tags/${TAG}" || { echo "tag does not exist" >&2; exit 1; }
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git merge-base --is-ancestor "$commit" "refs/remotes/origin/${DEFAULT_BRANCH}" || { echo "tag is not on the default branch" >&2; exit 1; }
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          git checkout --detach "$commit"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.17"

      - name: Check the tag and helper match the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/fm350mac/__init__.py)"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} does not match version ${version}" >&2; exit 1; }
          helper_version="$(sed -n 's/^HELPER_VERSION = "\(.*\)"$/\1/p' src/fm350mac/helper/fm350mac_helper.py)"
          test "${helper_version}" = "${version}" || { echo "HELPER_VERSION ${helper_version} does not match version ${version}" >&2; exit 1; }

      - name: ruff
        run: uvx ruff@0.16.10 check . ../tools

      - name: helper compiles under Python 3.9 -I -S
        run: uv run --no-project --python 3.9 python -I -S -c 'import sys; compile(open(sys.argv[1]).read(), sys.argv[1], "exec")' src/fm350mac/helper/fm350mac_helper.py

      - name: Build wheel and sdist
        run: uv build -o dist

      - name: Check the wheel and sdist contents
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/fm350mac/__init__.py)"
          ls dist/*"${version}"*.whl dist/*"${version}"*.tar.gz
          unzip -l dist/*.whl | grep -q 'fm350mac/helper/fm350mac_helper.py'
          unzip -l dist/*.whl | grep -q 'dist-info/licenses/LICENSE'

      - name: Write SHA256SUMS and the release notes
        run: |
          (cd dist && sha256sum -- *.whl *.tar.gz | tee SHA256SUMS)
          # Hash the helper as shipped (inside the wheel and the sdist), not the source tree.
          helper_sha="$(unzip -p dist/*.whl fm350mac/helper/fm350mac_helper.py | sha256sum | cut -d' ' -f1)"
          sdist_sha="$(tar -xzOf dist/*.tar.gz --wildcards '*/src/fm350mac/helper/fm350mac_helper.py' | sha256sum | cut -d' ' -f1)"
          test "${sdist_sha}" = "${helper_sha}" || { echo "the helper differs between the wheel (${helper_sha}) and the sdist (${sdist_sha})" >&2; exit 1; }
          grep -qxF "Helper sha256: \`${helper_sha}\`" ../CHANGELOG.md || { echo "CHANGELOG.md has no line 'Helper sha256: \`${helper_sha}\`': fill it in before tagging" >&2; exit 1; }
          {
            echo "Alpha release. See CHANGELOG.md for what is in it and what is not verified, and the fm350mac README for the trust model before installing the root helper."
            echo
            echo "Helper sha256: ${helper_sha}"
            echo
            echo "Compare it with the \`helper sha256:\` printed by \`fm350mac helper install --dry-run\` and install with \`--expect-sha256\`. Verify downloads against SHA256SUMS."
          } > dist/release-notes.md

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            fm350mac/dist/*.whl
            fm350mac/dist/*.tar.gz
            fm350mac/dist/SHA256SUMS
            fm350mac/dist/release-notes.md
          if-no-files-found: error

  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: publish a pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag still identifies the built commit
        env:
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          actual="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          test "$actual" = "$RELEASE_COMMIT" || { echo "tag changed after build" >&2; exit 1; }
      - name: Download the artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Create the GitHub pre-release
        run: |
          gh release create "${TAG}" \
            --verify-tag \
            --prerelease \
            --title "fm350mac ${TAG}" \
            --notes-file dist/release-notes.md \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS
